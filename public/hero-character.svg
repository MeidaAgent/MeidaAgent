<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff33cc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff33cc"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="300" cy="300" r="280" fill="url(#glow)"/>
  
  <!-- Body silhouette -->
  <ellipse cx="300" cy="450" rx="80" ry="180" fill="url(#body)" stroke="#ff33cc" stroke-width="0.5" opacity="0.9"/>
  
  <!-- Head -->
  <circle cx="300" cy="230" r="55" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  
  <!-- Hair - twin tails -->
  <path d="M260 200 Q220 150 200 280 Q210 260 240 220 Z" fill="url(#hair)" opacity="0.9" filter="url(#neonGlow)"/>
  <path d="M340 200 Q380 150 400 280 Q390 260 360 220 Z" fill="url(#hair)" opacity="0.9" filter="url(#neonGlow)"/>
  <path d="M250 210 Q230 180 210 300 Q220 270 245 225 Z" fill="url(#hair)" opacity="0.7"/>
  <path d="M350 210 Q370 180 390 300 Q380 270 355 225 Z" fill="url(#hair)" opacity="0.7"/>
  
  <!-- Hair top -->
  <path d="M260 200 Q280 170 300 175 Q320 170 340 200 Q330 185 300 180 Q270 185 260 200 Z" fill="url(#hair)" filter="url(#neonGlow)"/>
  
  <!-- Eyes -->
  <ellipse cx="280" cy="235" rx="8" ry="6" fill="#ff33cc" filter="url(#neonGlow)"/>
  <ellipse cx="320" cy="235" rx="8" ry="6" fill="#ff33cc" filter="url(#neonGlow)"/>
  <circle cx="280" cy="235" r="3" fill="#000"/>
  <circle cx="320" cy="235" r="3" fill="#000"/>
  
  <!-- Circuit lines on body -->
  <line x1="270" y1="310" x2="270" y2="400" stroke="#ff33cc" stroke-width="0.8" opacity="0.4"/>
  <line x1="330" y1="310" x2="330" y2="400" stroke="#ff33cc" stroke-width="0.8" opacity="0.4"/>
  <line x1="260" y1="350" x2="280" y2="350" stroke="#ff33cc" stroke-width="0.6" opacity="0.3"/>
  <line x1="320" y1="350" x2="340" y2="350" stroke="#ff33cc" stroke-width="0.6" opacity="0.3"/>
  <line x1="280" y1="380" x2="320" y2="380" stroke="#ff33cc" stroke-width="0.6" opacity="0.3"/>
  
  <!-- Circuit dots -->
  <circle cx="270" cy="310" r="2" fill="#ff33cc" opacity="0.6"/>
  <circle cx="330" cy="310" r="2" fill="#ff33cc" opacity="0.6"/>
  <circle cx="270" cy="400" r="2" fill="#ff33cc" opacity="0.6"/>
  <circle cx="330" cy="400" r="2" fill="#ff33cc" opacity="0.6"/>
  
  <!-- Collar accent -->
  <path d="M265 275 Q300 290 335 275" stroke="#ff33cc" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#neonGlow)"/>
  
  <!-- Arms -->
  <path d="M230 320 Q210 380 220 450" stroke="#333" stroke-width="1" fill="url(#body)"/>
  <path d="M370 320 Q390 380 380 450" stroke="#333" stroke-width="1" fill="url(#body)"/>
  
  <!-- Hands glow -->
  <circle cx="220" cy="450" r="8" fill="#1a1a1a" stroke="#ff33cc" stroke-width="0.5" opacity="0.5"/>
  <circle cx="380" cy="450" r="8" fill="#1a1a1a" stroke="#ff33cc" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Small floating particles -->
  <circle cx="180" cy="200" r="2" fill="#ff33cc" opacity="0.4"/>
  <circle cx="420" cy="180" r="1.5" fill="#ff33cc" opacity="0.3"/>
  <circle cx="150" cy="350" r="1" fill="#ff33cc" opacity="0.5"/>
  <circle cx="450" cy="320" r="1.5" fill="#ff33cc" opacity="0.4"/>
  <circle cx="200" cy="500" r="1" fill="#ff33cc" opacity="0.3"/>
  <circle cx="400" cy="480" r="2" fill="#ff33cc" opacity="0.3"/>
</svg>
